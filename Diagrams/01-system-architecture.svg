<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Mise system architecture</title><desc id="d">Client app sends commands to application API and services. Services use domain rules, database and optional providers. User approval gates list changes; purchase and cooking confirmations update Pantry.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#54736A"/></marker><marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3C7867"/></marker><style>
text{font-family:Arial,sans-serif;fill:#283638}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#71807B}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#52645F}.box{fill:#FFFEFA;stroke:#D6CCBA;stroke-width:2}.green{fill:#E5EFE5;stroke:#8EA892;stroke-width:2}.blue{fill:#E5F1EC;stroke:#76A293;stroke-width:2}.amber{fill:#FFF3D2;stroke:#D8BD68;stroke-width:2}.line{stroke:#54736A;stroke-width:2.4;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:7 6}.label{font-size:12px;fill:#52645F}</style></defs>
<rect width="1600" height="1000" fill="#FFF8E9"/><text x="60" y="62" class="title">Mise · system architecture</text><text x="60" y="91" class="sub">One connected application; optional providers advise, while domain rules own calculations and state.</text>
<!-- client band -->
<rect x="55" y="145" width="350" height="675" rx="22" class="box"/><text x="82" y="184" class="head">Client app</text><text x="82" y="208" class="small">Primary navigation and shared profile</text>
<rect x="82" y="242" width="296" height="75" rx="14" class="blue"/><text x="105" y="272" class="head">Cook Now</text><text x="105" y="295" class="small">Pantry based readiness · cooking</text>
<rect x="82" y="336" width="296" height="75" rx="14" class="blue"/><text x="105" y="366" class="head">Groceries</text><text x="105" y="389" class="small">Fresh request · editable shared list</text>
<rect x="82" y="430" width="296" height="75" rx="14" class="blue"/><text x="105" y="460" class="head">Pantry</text><text x="105" y="483" class="small">Confirmed owned inventory</text>
<rect x="82" y="524" width="296" height="75" rx="14" class="blue"/><text x="105" y="554" class="head">Explore + Profile</text><text x="105" y="577" class="small">Browse broadly · set preferences</text>
<rect x="82" y="640" width="296" height="105" rx="14" class="amber"/><text x="105" y="672" class="head">User approval</text><text x="105" y="696" class="small">Proposals change no list state.</text><text x="105" y="718" class="small">Only explicit actions commit changes.</text>
<!-- backend boundary -->
<rect x="450" y="145" width="1090" height="675" rx="24" fill="#F0F5EF" stroke="#8EA892" stroke-width="2.5"/><text x="480" y="184" class="head">Mise backend · modular application</text>
<rect x="490" y="230" width="230" height="145" rx="16" class="box"/><text x="515" y="265" class="head">API boundary</text><text x="515" y="295" class="body">Authentication</text><text x="515" y="319" class="body">Input validation</text><text x="515" y="343" class="body">User-scoped access</text>
<rect x="770" y="230" width="350" height="145" rx="16" class="green"/><text x="795" y="265" class="head">Application use cases</text><text x="795" y="295" class="body">Planning · list commands</text><text x="795" y="319" class="body">Purchase confirmation · cooking</text><text x="795" y="343" class="body">Profile · Pantry · discovery</text>
<rect x="1170" y="230" width="330" height="145" rx="16" class="box"/><text x="1195" y="265" class="head">Domain rules</text><text x="1195" y="295" class="body">Readiness · quantity math</text><text x="1195" y="319" class="body">Shortfall · consolidation</text><text x="1195" y="343" class="body">Policies · invariants</text>
<rect x="490" y="445" width="450" height="150" rx="16" class="box"/><text x="515" y="480" class="head">Relational database</text><text x="515" y="510" class="body">Users · profile · meal catalog</text><text x="515" y="534" class="body">Pantry · one open grocery list</text><text x="515" y="558" class="body">Proposals · purchase/cooking events</text>
<rect x="990" y="445" width="510" height="150" rx="16" class="box"/><text x="1015" y="480" class="head">Provider adapters (optional)</text><text x="1015" y="510" class="body">LLM interprets request; output is validated</text><text x="1015" y="534" class="body">Price/nutrition sources return estimates</text><text x="1015" y="558" class="body">Catalog import supplies reviewed content</text>
<rect x="490" y="650" width="1010" height="105" rx="16" class="amber"/><text x="520" y="684" class="head">Transactional state boundary</text><text x="520" y="711" class="body">Confirmed purchase → Pantry update · confirmed cooking → Pantry deduction · idempotent event record</text><text x="520" y="735" class="small">Unpurchased list items never count as owned; estimates never become actual spend.</text>
<!-- connectors routed in gutters -->
<path d="M405 375H440V300H480" class="line"/><text x="410" y="354" class="label">requests</text>
<path d="M720 302H760" class="line"/><path d="M1120 302H1160" class="line"/>
<path d="M1335 375V410H715V435" class="line"/><text x="978" y="404" class="label">repositories / transactions</text>
<path d="M1120 340V420H1240V435" class="line dash"/><text x="1130" y="414" class="label">validated provider calls</text>
<path d="M405 682H460V700H480" class="line"/><text x="407" y="672" class="label">explicit confirm</text>
<rect x="55" y="865" width="1485" height="78" rx="16" fill="#E5EFE5" stroke="#8EA892" stroke-width="2"/><text x="82" y="899" class="head">Core loop</text><text x="205" y="899" class="body">Discover → propose → user adds → shop → user confirms actual quantities → Pantry updates → Cook Now recalculates</text><text x="205" y="924" class="small">Cooking is separately confirmed before inventory is consumed.</text>
</svg>
