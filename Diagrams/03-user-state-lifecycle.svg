<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Mise user state lifecycle</title><desc id="d">Meal discovery creates proposal; user approves additions to list; confirmed purchases update Pantry; confirmed cooking consumes stock.</desc>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11z" fill="#55766B"/></marker><style>
text{font-family:Arial,sans-serif;fill:#283638}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#71807B}.h{font-size:18px;font-weight:700}.b{font-size:14px}.s{font-size:12px;fill:#52645F}.node{fill:#FFFEFA;stroke:#BDB4A5;stroke-width:2}.green{fill:#E5EFE5;stroke:#7D9A82;stroke-width:2}.gold{fill:#FFF3D2;stroke:#D1B558;stroke-width:2}.blue{fill:#E6F1ED;stroke:#739E90;stroke-width:2}.arrow{stroke:#55766B;stroke-width:2.4;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 6}</style></defs>
<rect width="1600" height="900" fill="#FFF8E9"/><text x="55" y="58" class="title">Mise · user-controlled food lifecycle</text><text x="55" y="86" class="sub">Each transition has a clear owner; browsing and planning do not mutate inventory.</text>
<!-- main horizontal states -->
<g><rect x="55" y="205" width="220" height="150" rx="18" class="node"/><text x="80" y="245" class="h">Discover meal</text><text x="80" y="277" class="b">Explore or Cook Now</text><text x="80" y="302" class="s">Save is interest only</text><text x="80" y="326" class="s">No grocery change</text></g>
<g><rect x="350" y="205" width="240" height="150" rx="18" class="gold"/><text x="375" y="245" class="h">Planning proposal</text><text x="375" y="277" class="b">Needs · overlap · estimates</text><text x="375" y="302" class="s">Pantry / list / missing shown</text><text x="375" y="326" class="s">No persistent list mutation</text></g>
<g><rect x="665" y="205" width="230" height="150" rx="18" class="green"/><text x="690" y="245" class="h">Open grocery list</text><text x="690" y="277" class="b">User adds and edits</text><text x="690" y="302" class="s">Consolidated intended items</text><text x="690" y="326" class="s">No owned-stock effect</text></g>
<g><rect x="970" y="205" width="230" height="150" rx="18" class="gold"/><text x="995" y="245" class="h">Purchase review</text><text x="995" y="277" class="b">User confirms actual lines</text><text x="995" y="302" class="s">Actual amount/package</text><text x="995" y="326" class="s">Price is optional</text></g>
<g><rect x="1270" y="205" width="260" height="150" rx="18" class="blue"/><text x="1295" y="245" class="h">Pantry updated</text><text x="1295" y="277" class="b">Confirmed owned quantities</text><text x="1295" y="302" class="s">Readiness recalculates</text><text x="1295" y="326" class="s">Transaction is idempotent</text></g>
<path d="M275 280H340" class="arrow"/><text x="285" y="265" class="s">choose / request</text><path d="M590 280H655" class="arrow"/><text x="600" y="265" class="s">explicit Add</text><path d="M895 280H960" class="arrow"/><text x="905" y="265" class="s">shop / review</text><path d="M1200 280H1260" class="arrow"/><text x="1202" y="265" class="s">confirm</text>
<!-- lower cooking branch -->
<g><rect x="1270" y="520" width="260" height="140" rx="18" class="blue"/><text x="1295" y="560" class="h">Ready to cook</text><text x="1295" y="592" class="b">Derived from Pantry only</text><text x="1295" y="617" class="s">List items are not counted</text></g>
<g><rect x="900" y="520" width="260" height="140" rx="18" class="node"/><text x="925" y="560" class="h">Cooking session</text><text x="925" y="592" class="b">Open recipe / start</text><text x="925" y="617" class="s">No inventory deduction</text></g>
<g><rect x="520" y="520" width="280" height="140" rx="18" class="gold"/><text x="545" y="560" class="h">Completion confirmation</text><text x="545" y="592" class="b">Confirm servings and use</text><text x="545" y="617" class="s">Optionally confirm leftovers</text></g>
<path d="M1400 355V500" class="arrow"/><text x="1412" y="433" class="s">feasibility query</text><path d="M1270 590H1170" class="arrow"/><text x="1180" y="574" class="s">cook choice</text><path d="M900 590H810" class="arrow"/><text x="820" y="574" class="s">user confirms</text>
<!-- feedback loop routes around bottom -->
<path d="M520 590H430V760H1400V670" class="arrow"/><text x="455" y="744" class="s">confirmed use / leftovers update Pantry; refresh readiness</text>
<!-- guardrail callouts -->
<rect x="55" y="420" width="340" height="120" rx="16" class="gold"/><text x="80" y="456" class="h">Proposal safety</text><text x="80" y="486" class="b">AI can interpret and explain.</text><text x="80" y="511" class="b">Rules calculate; user commits.</text>
<rect x="55" y="600" width="340" height="120" rx="16" class="green"/><text x="80" y="636" class="h">Estimate honesty</text><text x="80" y="666" class="b">Show ranges and source/age.</text><text x="80" y="691" class="b">Unknown data stays unknown.</text>
<text x="55" y="835" class="s">Partial purchases reconcile only confirmed quantities. Cooking is never recorded from opening or starting a recipe.</text>
</svg>
