<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="t d">
<title id="t">Mise proposed repository structure</title><desc id="d">Suggested monorepo containing mobile app, API, shared packages, data, documentation and tools with dependency direction from UI to application to domain ports implemented by infrastructure.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55766B"/></marker><style>
text{font-family:Arial,sans-serif;fill:#283638}.title{font-size:32px;font-weight:700}.sub{font-size:15px;fill:#71807B}.head{font-size:18px;font-weight:700}.path{font-size:14px;font-family:Consolas,monospace}.small{font-size:12px;fill:#52645F}.group{fill:#FFFEFA;stroke:#BDB4A5;stroke-width:2}.green{fill:#E5EFE5;stroke:#7D9A82;stroke-width:2}.blue{fill:#E6F1ED;stroke:#739E90;stroke-width:2}.gold{fill:#FFF3D2;stroke:#D1B558;stroke-width:2}.line{stroke:#55766B;stroke-width:2.4;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 6}</style></defs>
<rect width="1600" height="1120" fill="#FFF8E9"/><text x="55" y="58" class="title">Mise · proposed repository map</text><text x="55" y="86" class="sub">Blueprint for implementation; the current project folder is design-led and has no established app framework yet.</text>
<!-- root -->
<rect x="55" y="130" width="1490" height="95" rx="16" class="gold"/><text x="82" y="166" class="head">Mise/ (repository root)</text><text x="82" y="196" class="path">AGENTS.md · MASTER_SYSTEM_DESIGN.md · product specs · design assets · README · workspace config · .env.example</text>
<!-- apps -->
<rect x="55" y="275" width="710" height="525" rx="20" class="blue"/><text x="82" y="314" class="head">apps/</text>
<rect x="85" y="345" width="300" height="410" rx="15" class="group"/><text x="108" y="380" class="head">mobile/</text><text x="108" y="416" class="path">src/app/</text><text x="135" y="439" class="small">navigation · providers · shell</text><text x="108" y="474" class="path">src/features/</text><text x="135" y="498" class="small">cook-now/ · explore/</text><text x="135" y="522" class="small">groceries/ · pantry/ · profile/</text><text x="108" y="557" class="path">src/components/</text><text x="135" y="580" class="small">shared cards · rows · forms</text><text x="108" y="615" class="path">src/design-system/</text><text x="135" y="638" class="small">tokens · typography · icons</text><text x="108" y="673" class="path">src/data/ · assets/</text><text x="135" y="696" class="small">API client · images · original art</text>
<rect x="415" y="345" width="320" height="410" rx="15" class="group"/><text x="438" y="380" class="head">api/</text><text x="438" y="416" class="path">src/http/</text><text x="465" y="439" class="small">routes · auth · validation</text><text x="438" y="474" class="path">src/application/</text><text x="465" y="498" class="small">use cases · orchestration</text><text x="438" y="533" class="path">src/domain/</text><text x="465" y="557" class="small">entities · policies · ports</text><text x="438" y="592" class="path">src/infrastructure/</text><text x="465" y="616" class="small">DB · provider adapters</text><text x="438" y="651" class="path">src/workers/ · migrations/</text><text x="465" y="680" class="small">deferred jobs · schema changes</text>
<!-- packages -->
<rect x="825" y="275" width="720" height="260" rx="20" class="green"/><text x="852" y="314" class="head">packages/ · stable shared building blocks</text>
<rect x="855" y="345" width="195" height="145" rx="13" class="group"/><text x="875" y="378" class="path">contracts/</text><text x="875" y="407" class="small">API schemas</text><text x="875" y="430" class="small">DTOs · enums</text>
<rect x="1070" y="345" width="195" height="145" rx="13" class="group"/><text x="1090" y="378" class="path">domain/</text><text x="1090" y="407" class="small">pure business model</text><text x="1090" y="430" class="small">no vendor imports</text>
<rect x="1285" y="345" width="225" height="145" rx="13" class="group"/><text x="1305" y="378" class="path">ingredient-math/</text><text x="1305" y="407" class="small">scaling · units</text><text x="1305" y="430" class="small">shortfall · consolidation</text>
<!-- data docs tools -->
<rect x="825" y="580" width="345" height="220" rx="20" class="gold"/><text x="852" y="619" class="head">data/</text><text x="852" y="656" class="path">seed/</text><text x="935" y="656" class="small">meals · ingredients · aliases</text><text x="852" y="690" class="path">estimates/</text><text x="935" y="690" class="small">price/nutrition + provenance</text><text x="852" y="724" class="path">schemas/</text><text x="935" y="724" class="small">import validation</text><text x="852" y="765" class="small">Curated and reviewable data</text>
<rect x="1200" y="580" width="345" height="220" rx="20" class="group"/><text x="1227" y="619" class="head">docs/ + tools/</text><text x="1227" y="656" class="path">docs/adr · api · domain</text><text x="1227" y="680" class="small">decisions · contracts · glossary</text><text x="1227" y="715" class="path">docs/operations · research</text><text x="1227" y="739" class="path">tools/catalog-import · scripts</text><text x="1227" y="773" class="small">Operations, evidence, maintenance</text>
<!-- dependency architecture -->
<rect x="55" y="850" width="1490" height="190" rx="20" fill="#F0F5EF" stroke="#8EA892" stroke-width="2"/><text x="82" y="888" class="head">Dependency direction</text>
<rect x="100" y="920" width="230" height="72" rx="14" class="blue"/><text x="130" y="951" class="head">Mobile + HTTP</text><text x="130" y="975" class="small">presentation / adapters</text>
<rect x="455" y="920" width="250" height="72" rx="14" class="green"/><text x="485" y="951" class="head">Application</text><text x="485" y="975" class="small">use cases / transactions</text>
<rect x="830" y="920" width="240" height="72" rx="14" class="gold"/><text x="860" y="951" class="head">Domain</text><text x="860" y="975" class="small">rules / ports / invariants</text>
<rect x="1210" y="920" width="250" height="72" rx="14" class="group"/><text x="1240" y="951" class="head">Infrastructure</text><text x="1240" y="975" class="small">implements domain ports</text>
<path d="M330 956H445" class="line"/><path d="M705 956H820" class="line"/><path d="M1070 956H1200" class="line dash"/><text x="1100" y="941" class="small">implementation boundary</text>
<text x="82" y="1023" class="small">Domain stays framework- and provider-independent. Database and LLM SDKs enter only through infrastructure adapters.</text>
</svg>
