<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="t d">
<title id="t">Mise domain class model</title><desc id="d">Core user, profile, meal catalog, grocery list, pantry, purchase and cooking entities with their relations and ownership boundaries.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#55766B"/></marker><style>
text{font-family:Arial,sans-serif;fill:#283638}.title{font-size:32px;font-weight:700}.sub{font-size:15px;fill:#71807B}.name{font-size:17px;font-weight:700}.field{font-size:13px}.small{font-size:12px;fill:#52645F}.card{fill:#FFFEFA;stroke:#BDB4A5;stroke-width:1.7}.green{fill:#E5EFE5;stroke:#7D9A82;stroke-width:2}.blue{fill:#E6F1ED;stroke:#739E90;stroke-width:2}.gold{fill:#FFF3D2;stroke:#D1B558;stroke-width:2}.rel{stroke:#55766B;stroke-width:1.8;fill:none;marker-end:url(#a)}.dashed{stroke-dasharray:6 5}.divider{stroke:#D6CCBA;stroke-width:1}</style></defs>
<rect width="1700" height="1120" fill="#FFF8E9"/><text x="55" y="55" class="title">Mise · domain model</text><text x="55" y="82" class="sub">Stable IDs connect meals, Pantry, and Groceries; owned inventory and intended purchases remain separate.</text>
<!-- Profile/user -->
<g><rect x="60" y="140" width="260" height="135" rx="13" class="blue"/><text x="82" y="170" class="name">User</text><line x1="60" y1="181" x2="320" y2="181" class="divider"/><text x="82" y="205" class="field">userId</text><text x="82" y="227" class="field">account / household scope</text><text x="82" y="249" class="field">createdAt</text></g>
<g><rect x="60" y="330" width="260" height="200" rx="13" class="blue"/><text x="82" y="360" class="name">Profile</text><line x1="60" y1="372" x2="320" y2="372" class="divider"/><text x="82" y="398" class="field">strictRestrictions[]</text><text x="82" y="420" class="field">flexibleGoals[] · tastes[]</text><text x="82" y="442" class="field">cookingPreferences</text><text x="82" y="464" class="field">equipment[] · shoppingDefaults</text><text x="82" y="499" class="small">Preferences never silently override</text></g>
<!-- meal catalog -->
<g><rect x="410" y="140" width="300" height="170" rx="13" class="card"/><text x="432" y="170" class="name">Meal</text><line x1="410" y1="182" x2="710" y2="182" class="divider"/><text x="432" y="207" class="field">mealId · title · kind</text><text x="432" y="229" class="field">source · version · servings</text><text x="432" y="251" class="field">steps[] · practicalMetadata</text><text x="432" y="273" class="field">nutritionEstimate?</text></g>
<g><rect x="410" y="375" width="300" height="145" rx="13" class="card"/><text x="432" y="405" class="name">MealIngredient</text><line x1="410" y1="417" x2="710" y2="417" class="divider"/><text x="432" y="442" class="field">ingredientId · requiredAmount</text><text x="432" y="464" class="field">unit · optional · servingBasis</text><text x="432" y="493" class="small">Requirement is not purchase quantity</text></g>
<g><rect x="410" y="605" width="300" height="145" rx="13" class="card"/><text x="432" y="635" class="name">Ingredient</text><line x1="410" y1="647" x2="710" y2="647" class="divider"/><text x="432" y="672" class="field">ingredientId · canonicalName</text><text x="432" y="694" class="field">aliases[] · unitDimension</text><text x="432" y="716" class="field">substitutionGroup?</text></g>
<!-- grocery -->
<g><rect x="800" y="140" width="330" height="170" rx="13" class="green"/><text x="822" y="170" class="name">GroceryList</text><line x1="800" y1="182" x2="1130" y2="182" class="divider"/><text x="822" y="207" class="field">listId · userId · status</text><text x="822" y="229" class="field">version · one open per user</text><text x="822" y="251" class="field">selectedMeals[]</text><text x="822" y="278" class="small">Source of truth for intended purchases</text></g>
<g><rect x="800" y="375" width="330" height="180" rx="13" class="green"/><text x="822" y="405" class="name">GroceryItem</text><line x1="800" y1="417" x2="1130" y2="417" class="divider"/><text x="822" y="442" class="field">itemId · ingredientId? · label</text><text x="822" y="464" class="field">plannedQuantity · pickedUp?</text><text x="822" y="486" class="field">estimate? · userNotes</text><text x="822" y="525" class="small">Picked up ≠ purchased confirmation</text></g>
<g><rect x="800" y="620" width="330" height="140" rx="13" class="gold"/><text x="822" y="650" class="name">PlanningProposal</text><line x1="800" y1="662" x2="1130" y2="662" class="divider"/><text x="822" y="687" class="field">proposalId · mealOptions[]</text><text x="822" y="709" class="field">proposedAdditions[] · rationale</text><text x="822" y="738" class="small">Ephemeral until user chooses Add</text></g>
<!-- pantry -->
<g><rect x="1240" y="140" width="380" height="170" rx="13" class="blue"/><text x="1262" y="170" class="name">Pantry</text><line x1="1240" y1="182" x2="1620" y2="182" class="divider"/><text x="1262" y="207" class="field">pantryId · userId</text><text x="1262" y="229" class="field">InventoryEntry[]</text><text x="1262" y="260" class="small">Only confirmed owned food</text></g>
<g><rect x="1240" y="375" width="380" height="185" rx="13" class="blue"/><text x="1262" y="405" class="name">InventoryEntry</text><line x1="1240" y1="417" x2="1620" y2="417" class="divider"/><text x="1262" y="442" class="field">entryId · ingredientId</text><text x="1262" y="464" class="field">onHand · unit · storageLocation</text><text x="1262" y="486" class="field">freshnessEstimate? · inventoryKind</text><text x="1262" y="528" class="small">Raw ingredient or prepared food</text></g>
<!-- events and estimate -->
<g><rect x="1240" y="640" width="380" height="150" rx="13" class="gold"/><text x="1262" y="670" class="name">PurchaseConfirmation</text><line x1="1240" y1="682" x2="1620" y2="682" class="divider"/><text x="1262" y="707" class="field">purchaseId · confirmedLines[]</text><text x="1262" y="729" class="field">actual quantity/package · price?</text><text x="1262" y="759" class="small">Idempotent; transaction updates Pantry</text></g>
<g><rect x="800" y="835" width="330" height="150" rx="13" class="gold"/><text x="822" y="865" class="name">CookingRecord</text><line x1="800" y1="877" x2="1130" y2="877" class="divider"/><text x="822" y="902" class="field">cookingId · mealId · servings</text><text x="822" y="924" class="field">consumedLines[] · leftovers[]</text><text x="822" y="954" class="small">Only completion changes inventory</text></g>
<g><rect x="410" y="835" width="300" height="150" rx="13" class="gold"/><text x="432" y="865" class="name">Estimate</text><line x1="410" y1="877" x2="710" y2="877" class="divider"/><text x="432" y="902" class="field">priceRange? · nutrition?</text><text x="432" y="924" class="field">source · asOf · confidence</text><text x="432" y="954" class="small">Unknown stays unknown</text></g>
<!-- relations use routed clear lanes -->
<path d="M190 275V322" class="rel"/><text x="198" y="304" class="small">1 : 1</text>
<path d="M710 447H760V310H790" class="rel"/><text x="731" y="432" class="small">selected meal refs</text>
<path d="M560 310V365" class="rel"/><text x="570" y="345" class="small">1 : many</text>
<path d="M560 520V595" class="rel"/><text x="570" y="568" class="small">uses</text>
<path d="M410 285H380V910H400" class="rel dashed"/><text x="330" y="595" class="small">optional</text>
<path d="M965 310V365" class="rel"/><text x="975" y="345" class="small">1 : many</text>
<path d="M1130 465H1228" class="rel"/><text x="1140" y="453" class="small">distinct records</text>
<path d="M1430 310V365" class="rel"/><text x="1440" y="345" class="small">1 : many</text>
<path d="M710 675H770V765H1190V715H1230" class="rel"/><text x="855" y="783" class="small">canonical ingredient ID</text>
<path d="M1430 640V570" class="rel"/><text x="1440" y="611" class="small">adds actual amount</text>
<path d="M965 555V610H1180V700H1230" class="rel dashed"/><text x="980" y="601" class="small">reviewed actual lines</text>
<path d="M965 835V780H1180V520H1230" class="rel"/><text x="1080" y="818" class="small">confirmed consumption</text>
<rect x="60" y="1030" width="1560" height="54" rx="14" fill="#E5EFE5" stroke="#8EA892" stroke-width="1.7"/><text x="85" y="1064" class="field">Solid model links show durable ownership or references. Gold records are proposals, estimates, or explicit user-confirmation events; none silently become inventory.</text>
</svg>
